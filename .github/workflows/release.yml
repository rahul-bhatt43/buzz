# Builds the Windows installer and the Android APK and attaches both to a
# GitHub Release. Runs when a version tag such as v0.1.0 is pushed.
#
# The Android build needs four repository secrets (Settings > Secrets and
# variables > Actions), described in the README under "Publishing a release":
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: releases/desktop/Buzz-Setup-*.exe
          if-no-files-found: error

  mobile:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets are not set, so the APK cannot be signed. See the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > buzz-release.jks
          {
            echo "storeFile=buzz-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleRelease
      - name: Name the APK after the version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Buzz-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: mobile/Buzz-*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [desktop, mobile]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
